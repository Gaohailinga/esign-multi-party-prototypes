<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>展业范围含五省二市 - 掌中宝</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      color: #333;
      font-size: 15px;
    }
    .mobile-wrap {
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f5f5f5;
      position: relative;
    }

    /* 顶部导航 */
    .nav-bar {
      height: 48px;
      background: #06b799;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .nav-back {
      position: absolute;
      left: 0;
      top: 0;
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      color: #fff;
      font-size: 20px;
      text-decoration: none;
    }
    .nav-title {
      font-size: 17px;
      font-weight: 500;
      color: #fff;
    }
    .nav-done {
      position: absolute;
      right: 0;
      top: 0;
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      color: #fff;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: transparent;
    }

    /* 选项列表 */
    .option-list {
      background: #fff;
      margin-top: 10px;
    }
    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .option-item:last-child { border-bottom: none; }
    .option-item:active { background: #f9f9f9; }
    .option-text {
      font-size: 16px;
      color: #333;
    }
    .option-item.selected .option-text {
      color: #06b799;
    }
    .option-check {
      display: none;
      color: #06b799;
      font-size: 18px;
      font-weight: bold;
    }
    .option-item.selected .option-check {
      display: block;
    }
  </style>
</head>
<body>
  <div class="mobile-wrap">
    <div class="nav-bar">
      <a class="nav-back" href="zzb-supplement-info.html">&#60;</a>
      <div class="nav-title">展业范围含五省二市</div>
      <button class="nav-done" id="btn-done">完成</button>
    </div>

    <div class="option-list">
      <div class="option-item" data-value="yes">
        <span class="option-text">是</span>
        <span class="option-check">✓</span>
      </div>
      <div class="option-item" data-value="no">
        <span class="option-text">否</span>
        <span class="option-check">✓</span>
      </div>
    </div>
  </div>

  <script>
    const items = document.querySelectorAll('.option-item');
    const btnDone = document.getElementById('btn-done');
    let selected = null;

    items.forEach(item => {
      item.addEventListener('click', function() {
        items.forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
        selected = item.getAttribute('data-value');
      });
    });

    btnDone.addEventListener('click', function() {
      if (selected) {
        window.location.href = 'zzb-supplement-info.html?scope=' + selected;
      } else {
        window.location.href = 'zzb-supplement-info.html';
      }
    });
  </script>
</body>
</html>
