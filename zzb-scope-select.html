<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>展业范围含五省二市 - 掌中宝</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #d0d0d0;
      color: #333;
      font-size: 15px;
    }
    .mobile-wrap {
      max-width: 375px;
      margin: 20px auto;
      min-height: calc(100vh - 40px);
      background: #f5f5f5;
      border-radius: 36px;
      border: 8px solid #f0f0f0;
      box-shadow: 0 0 0 1px #d9d9d9, 0 20px 50px rgba(0,0,0,0.22);
      overflow: hidden;
      position: relative;
      padding-bottom: 24px;
    }

    /* 顶部状态栏 */
    .status-bar {
      height: 28px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      font-size: 12px;
      color: #000;
      position: relative;
      z-index: 2;
    }
    .status-bar .time { font-weight: 600; }
    .status-bar .icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-bar .signal {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
    }
    .status-bar .signal span {
      width: 3px;
      background: #000;
      border-radius: 1px;
    }
    .status-bar .signal span:nth-child(1) { height: 4px; }
    .status-bar .signal span:nth-child(2) { height: 6px; }
    .status-bar .signal span:nth-child(3) { height: 8px; }
    .status-bar .signal span:nth-child(4) { height: 10px; }
    .status-bar .battery {
      width: 18px;
      height: 8px;
      border: 1px solid #000;
      border-radius: 2px;
      position: relative;
      margin-left: 2px;
    }
    .status-bar .battery::before {
      content: '';
      position: absolute;
      left: 1px;
      top: 1px;
      bottom: 1px;
      width: 70%;
      background: #000;
      border-radius: 1px;
    }
    .status-bar .battery::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #000;
      border-radius: 0 1px 1px 0;
    }
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 22px;
      background: #1a1a1a;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      z-index: 10;
    }

    /* 底部 Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      z-index: 10;
    }

    /* 顶部导航 */
    .nav-bar {
      height: 48px;
      background: #06b799;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .nav-back {
      position: absolute;
      left: 0;
      top: 0;
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      color: #fff;
      font-size: 20px;
      text-decoration: none;
    }
    .nav-title {
      font-size: 17px;
      font-weight: 500;
      color: #fff;
    }
    .nav-done {
      position: absolute;
      right: 0;
      top: 0;
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      color: #fff;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: transparent;
    }

    /* 选项列表 */
    .option-list {
      background: #fff;
      margin: 12px 12px 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .option-item:last-child { border-bottom: none; }
    .option-item:active { background: #f9f9f9; }
    .option-text {
      font-size: 16px;
      color: #333;
    }
    .option-item.selected .option-text {
      color: #06b799;
      font-weight: 500;
    }
    .option-check {
      display: none;
      color: #06b799;
      font-size: 18px;
      font-weight: bold;
    }
    .option-item.selected .option-check {
      display: block;
    }
    .option-tip {
      margin: 12px 12px 0;
      padding: 12px 14px;
      background: #fff;
      border-radius: 8px;
      font-size: 13px;
      color: #888;
      line-height: 1.6;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
  <div class="mobile-wrap">
    <div class="notch"></div>
    <div class="status-bar">
      <span class="time">13:14</span>
      <div class="icons">
        <div class="signal"><span></span><span></span><span></span><span></span></div>
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>

    <div class="nav-bar">
      <a class="nav-back" href="zzb-supplement-info.html">&#60;</a>
      <div class="nav-title">展业范围含五省二市</div>
      <button class="nav-done" id="btn-done">完成</button>
    </div>

    <div class="option-list">
      <div class="option-item" data-value="yes">
        <span class="option-text">是</span>
        <span class="option-check">✓</span>
      </div>
      <div class="option-item" data-value="no">
        <span class="option-text">否</span>
        <span class="option-check">✓</span>
      </div>
    </div>

    <div class="option-tip">提示：选择“是”表示将在五省二市【黑龙江、吉林、辽宁、浙江、福建（厦门除外）】地区作业，签约时需同步签署双主体合作协议。</div>

    <div class="home-indicator"></div>
  </div>

  <script>
    const items = document.querySelectorAll('.option-item');
    const btnDone = document.getElementById('btn-done');
    let selected = null;

    items.forEach(item => {
      item.addEventListener('click', function() {
        items.forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
        selected = item.getAttribute('data-value');
      });
    });

    btnDone.addEventListener('click', function() {
      if (selected) {
        window.location.href = 'zzb-supplement-info.html?scope=' + selected;
      } else {
        window.location.href = 'zzb-supplement-info.html';
      }
    });
  </script>
</body>
</html>
